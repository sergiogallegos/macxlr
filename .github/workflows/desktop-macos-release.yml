name: MacXLR Desktop macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-ui-v*"

jobs:
  build-macos:
    name: Build MacXLR Desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: x64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64

    env:
      CI: true
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install desktop UI dependencies
        working-directory: desktop-ui
        run: npm ci

      - name: Prepare App Store Connect API key
        if: ${{ secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_ISSUER != '' }}
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build MacXLR Desktop bundle
        working-directory: desktop-ui
        shell: bash
        run: npm exec -- tauri build -- --target "${{ matrix.target }}" --bundles app,dmg

      - name: Upload app and DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macxlr-desktop-${{ matrix.target }}
          path: |
            desktop-ui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            desktop-ui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
